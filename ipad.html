<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バス運賃表示器・iPad表示</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --base-w: 598;
    --base-h: 336;
    --pt-ratio: 1.333; /* TkinterのptをWebのpxに合わせる補正 */
  }
  
  body { background-color: #222; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; font-family: sans-serif; }

  /* =========================================
     ディスプレイ画面 (dp)
  ========================================= */
  #dp-screen {
    width: 100%; max-width: 800px; aspect-ratio: var(--base-w) / var(--base-h); background-color: #080302; position: relative; overflow: hidden; container-type: inline-size; font-family: 'BIZ UDPGothic', sans-serif; color: #ffffff; user-select: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #000;
  }

  .abs { position: absolute; }
  .flex-center { display: flex; justify-content: center; align-items: center; }
  
  /* 画面切り替え */
  .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; visibility: hidden; }
  .screen.active { opacity: 1; visibility: visible; z-index: 10; }
  
  /* 割り込み画像画面 */
  .interrupt-screen { position: absolute; top: 0; left: 0; width: 100%; height: calc(290 / var(--base-h) * 100%); opacity: 0; visibility: hidden; z-index: 20; }
  .interrupt-screen.active { opacity: 1; visibility: visible; }
  .full-img { width: 100%; height: 100%; object-fit: fill; }

  /* Screen 1 */
  .sc1-blue-bg { top: calc(76 / var(--base-h) * 100%); left: 0; width: 100%; height: calc(214 / var(--base-h) * 100%); background-color: #497BA4; }
  .next-box { top: 0; left: 0; width: calc(33 / var(--base-w) * 100%); height: calc(70 / var(--base-h) * 100%); background-color: #497BA4; font-size: calc(19 * var(--pt-ratio) / var(--base-w) * 100cqw); font-weight: bold; text-align: center; line-height: 1; white-space: pre-wrap; }
  .next-box-border { top: calc(70 / var(--base-h) * 100%); left: 0; width: calc(33 / var(--base-w) * 100%); height: calc(3 / var(--base-h) * 100%); background-color: #DFD65C; }
  .main-dest { top: calc(38 / var(--base-h) * 100%); left: calc(315 / var(--base-w) * 100%); transform: translate(-50%, -50%); font-size: calc(35 * var(--pt-ratio) / var(--base-w) * 100cqw); line-height: 1; white-space: nowrap; }
  .child-half-txt { top: calc(86 / var(--base-h) * 100%); left: calc(100 / var(--base-w) * 100%); transform: translateY(-50%); font-size: calc(10 * var(--pt-ratio) / var(--base-w) * 100cqw); line-height: 1; }
  .label-ticket { top: calc(78 / var(--base-h) * 100%); left: calc(3 / var(--base-w) * 100%); width: calc(46 / var(--base-w) * 100%); height: calc(16 / var(--base-h) * 100%); background-color: #080302; font-size: calc(9 * var(--pt-ratio) / var(--base-w) * 100cqw); font-weight: bold; line-height: 1; }
  .label-fare { top: calc(78 / var(--base-h) * 100%); left: calc(51 / var(--base-w) * 100%); width: calc(46 / var(--base-w) * 100%); height: calc(16 / var(--base-h) * 100%); background-color: #080302; color: #D8A533; font-size: calc(9 * var(--pt-ratio) / var(--base-w) * 100cqw); font-weight: bold; line-height: 1; }
  .fare-cell { width: calc(196 / var(--base-w) * 100%); height: calc(95 / var(--base-h) * 100%); }
  .cell-top { top: 0; left: 0; width: 100%; height: calc(35 / 95 * 100%); background-color: #082345; }
  .cell-bottom { top: calc(35 / 95 * 100%); left: 0; width: 100%; height: calc(60 / 95 * 100%); background-color: #080302; }
  .cell-no { font-size: calc(24 * var(--pt-ratio) / var(--base-w) * 100cqw); font-weight: bold; line-height: 1; }
  .cell-val { font-size: calc(32 * var(--pt-ratio) / var(--base-w) * 100cqw); font-weight: bold; color: #D8A533; line-height: 1; }

  /* Screen 2 & 3 共通・専用デザイン */
  .top-bar-blue { top: 0; left: 0; width: 100%; height: calc(36 / var(--base-h) * 100%); background-color: #497BA4; }
  .top-bar-text { top: calc(18 / var(--base-h) * 100%); left: 50%; transform: translate(-50%, -50%); font-size: calc(16 * var(--pt-ratio) / var(--base-w) * 100cqw); line-height: 1; white-space: nowrap; }
  .yellow-bar { left: 0; width: 100%; height: calc(3 / var(--base-h) * 100%); background-color: #DFD65C; }
  .gray-bar { top: calc(287 / var(--base-h) * 100%); left: 0; width: 100%; height: calc(3 / var(--base-h) * 100%); background-color: #778A8C; }
  
  .sc2-black-bottom { top: calc(203 / var(--base-h) * 100%); left: 0; width: 100%; height: calc(84 / var(--base-h) * 100%); background-color: #101010; }
  .sc2-next-stop-ja { top: calc(140 / var(--base-h) * 100%); left: 50%; transform: translate(-50%, -50%); font-size: calc(35 * var(--pt-ratio) / var(--base-w) * 100cqw); line-height: 1; white-space: nowrap; }
  .sc2-next-stop-en { top: calc(245 / var(--base-h) * 100%); left: 50%; transform: translate(-50%, -50%); font-size: calc(18 * var(--pt-ratio) / var(--base-w) * 100cqw); color: #A2B8B8; line-height: 1; white-space: nowrap; }

  /* Screen 3 */
  .sc3-bg-img { top: calc(36 / var(--base-h) * 100%); left: 0; width: 100%; height: calc(290 / var(--base-h) * 100%); object-fit: fill; clip-path: inset(0 0 calc(36 / 290 * 100%) 0); }
  /* Tkinterのanchor="nw"と同じ挙動にするため、余計なmarginを消して純粋に座標配置 */
  .sc3-via-ja { left: calc(125 / var(--base-w) * 100%); font-size: calc(17 * var(--pt-ratio) / var(--base-w) * 100cqw); line-height: 1; white-space: nowrap; transform-origin: top left; }
  .sc3-via-en { left: calc(125 / var(--base-w) * 100%); font-size: calc(11 * var(--pt-ratio) / var(--base-w) * 100cqw); color: #ffffff; line-height: 1; white-space: nowrap; transform-origin: top left; }
  .sc3-dest-ja { left: calc(125 / var(--base-w) * 100%); font-size: calc(20 * var(--pt-ratio) / var(--base-w) * 100cqw); line-height: 1; white-space: nowrap; transform-origin: top left; }
  .sc3-dest-en { left: calc(125 / var(--base-w) * 100%); font-size: calc(13 * var(--pt-ratio) / var(--base-w) * 100cqw); color: #ffffff; line-height: 1; white-space: nowrap; transform-origin: top left; }

  /* スクロールエリア */
  .scroll-area { top: calc(291 / var(--base-h) * 100%); left: 0; width: 100%; height: calc(45 / var(--base-h) * 100%); background-color: #080302; overflow: hidden; z-index: 100; }
  .scroll-txt { top: 50%; transform: translateY(-50%); white-space: nowrap; color: #D8A533; font-size: calc(30 * var(--pt-ratio) / var(--base-w) * 100cqw); line-height: 1; }

  /* 操作パネル */
  #controller { width: 100%; max-width: 800px; margin-top: 30px; background-color: #e0e0e0; padding: 20px; border-radius: 8px; box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .panel-section { background: #fff; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .panel-section h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; border-bottom: 2px solid #333; padding-bottom: 5px; }
  .setting-group { margin-bottom: 15px; }
  .setting-group label { display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold;}
  .radio-group { display: flex; flex-direction: column; gap: 5px; font-size: 14px; margin-bottom: 10px;}
  .button-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
  button { padding: 10px; font-size: 18px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.3); }
  button:active { transform: translateY(3px); box-shadow: none; }
  button:disabled { background-color: #999 !important; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-next { background-color: #db3131; color: white; grid-column: span 2; height: 60px; font-size: 24px;}
  .btn-back { background-color: #222222; color: white; height: 60px;}
  .btn-door { background-color: #222222; color: white; height: 60px; font-size: 24px; }
  .btn-reset { background-color: #222222; color: white; font-size: 14px; }
  .stop-button { background-color: #DACD27; border: 2px solid #fff; border-radius: 8px; padding: 10px; margin-bottom: 15px; cursor: pointer; text-align: center; box-shadow: inset 0 0 0 5px #120109; transition: 0.2s; }
  .stop-button-text { background-color: #211117; color: #211117; border-radius: 4px; padding: 10px; font-family: 'MS UI Gothic', sans-serif; font-size: 24px; font-weight: bold; text-shadow: 0 0 5px rgba(228, 110, 121, 0); }
  .stop-button.pushed .stop-button-text { color: #e46e79; text-shadow: 0 0 10px #e46e79; }
  .file-input { display: block; width: 100%; border: 2px dashed #497BA4; padding: 10px; box-sizing: border-box; background: #f9f9f9; cursor: pointer; }
  #connection-bar { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; background: rgba(0,0,0,.72); }
  .login-card { width: min(100%, 360px); padding: 24px; border-radius: 14px; box-sizing: border-box; background: #f4f4f4; color: #171717; box-shadow: 0 16px 48px rgba(0,0,0,.45); }
  .login-card h1 { margin: 0 0 18px; font-size: 22px; }
  .login-card label { display: block; margin: 12px 0 5px; font-size: 14px; font-weight: 700; }
  .login-card input { width: 100%; padding: 11px; box-sizing: border-box; font-size: 16px; }
  .login-card button { width: 100%; margin-top: 16px; padding: 11px; font-size: 16px; }
  #connection-status { margin-top: 12px; font-size: 13px; color: #333; overflow-wrap: anywhere; }
  .role-tag { font-weight: bold; padding: 7px 10px; background: #dceafa; border-radius: 4px; }
  #tts-voice { display: none; }
  body.mode-display { padding: 12px; }
  body.mode-display #controller { display: none; }
  body.mode-display #dp-screen { max-width: min(100%, 1200px); }
  body.mode-display.authenticated { height: 100dvh; min-height: 100dvh; padding: 0; justify-content: center; overflow: hidden; touch-action: manipulation; background: #111; transition: background 180ms ease; }
  body.mode-display.authenticated #connection-bar { display: none; }
  body.mode-display.authenticated #dp-screen { width: min(100vw, 177.976dvh); max-width: none; flex: none; border: 0; z-index: 1; }
  body.mode-display.authenticated.stop-active { background: radial-gradient(ellipse at center, #c51f2e 0%, #9e121f 65%, #5c0b13 100%); box-shadow: inset 0 0 80px rgba(255, 45, 60, .95); }
  body.mode-controller #dp-screen { display: none; }
  body.mode-controller #controller { max-width: 800px; margin-top: 0; }
  @media (max-width: 600px) { #controller { grid-template-columns: 1fr; padding: 12px; gap: 12px; } .panel-section { padding: 12px; } }
  #lcd-blackout { position:absolute; inset:0; z-index:1000; background:#000; pointer-events:none; }
</style>
<link rel="manifest" href="ipad.webmanifest?v=22">
<link rel="apple-touch-icon" sizes="512x512" href="app-icons/home-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="運賃表示器">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2563eb">
</head>
<body data-mode="display">

<button id="audio-retry" type="button" style="position:fixed;bottom:16px;right:16px;z-index:2000;background:#fff;color:#222;padding:10px 14px;font-size:14px;">音声確認</button>
<div id="connection-bar">
  <section class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">運賃表示器</h1>
    <label for="login-email">ユーザーID</label>
    <input id="login-email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="login-password">パスワード</label>
    <input id="login-password" type="password" autocomplete="current-password">
    <button id="login-button">ログイン</button>
    <button id="logout-button" style="display:none">ログアウト</button>
    <div id="connection-status" role="status">Firebaseへ接続中…</div>
  </section>
  <select id="tts-voice" aria-label="読み上げ音声"><option value="">端末の標準音声</option></select>
</div>

<div id="dp-screen">
  <div id="lcd-blackout" hidden aria-hidden="true"></div>
  <div id="screen1" class="screen active">
    <div class="abs sc1-blue-bg"></div>
    <div class="abs flex-center next-box" id="next-box-text">次<br>は</div>
    <div class="abs next-box-border"></div>
    <div class="abs main-dest" id="main-dest-text">-- 終点 --</div>
    <div class="abs child-half-txt">小児半額(但し端数は１０円単位に切り上げ)</div>
    <div class="abs flex-center label-ticket">整理券</div>
    <div class="abs flex-center label-fare">運 賃</div>
    <div id="fare-grid"></div>
  </div>

  <div id="screen2" class="screen">
    <div class="abs top-bar-blue"></div>
    <div class="abs top-bar-text">次 は ｜ NEXT</div>
    <div class="abs yellow-bar" style="top: calc(200 / var(--base-h) * 100%);"></div>
    <div class="abs sc2-black-bottom"></div>
    <div class="abs gray-bar"></div>
    <div class="abs sc2-next-stop-ja" id="sc2-next-stop-ja">-- 次の停留所 --</div>
    <div class="abs sc2-next-stop-en" id="sc2-next-stop-en">-- Next Stop --</div>
  </div>

  <div id="screen3" class="screen">
    <div class="abs top-bar-blue"></div>
    <div class="abs top-bar-text">経由地 ｜ VIA</div>
    <img src="data/screen3.png" class="abs sc3-bg-img" alt="" onerror="this.style.display='none'">
    
    <div class="abs sc3-via-ja" id="sc3-ja-0" style="top: calc(73 / var(--base-h) * 100%);"></div>
    <div class="abs sc3-via-en" id="sc3-en-0" style="top: calc(101 / var(--base-h) * 100%);"></div>
    <div class="abs sc3-via-ja" id="sc3-ja-1" style="top: calc(124.5 / var(--base-h) * 100%);"></div>
    <div class="abs sc3-via-en" id="sc3-en-1" style="top: calc(152.5 / var(--base-h) * 100%);"></div>
    <div class="abs sc3-via-ja" id="sc3-ja-2" style="top: calc(176 / var(--base-h) * 100%);"></div>
    <div class="abs sc3-via-en" id="sc3-en-2" style="top: calc(204 / var(--base-h) * 100%);"></div>
    <div class="abs sc3-dest-ja" id="sc3-ja-3" style="top: calc(228 / var(--base-h) * 100%);">-- 終点 --</div>
    <div class="abs sc3-dest-en" id="sc3-en-3" style="top: calc(262 / var(--base-h) * 100%);">-- Destination --</div>
    <div class="abs yellow-bar" style="top: calc(256 / var(--base-h) * 100%);"></div>
    <div class="abs gray-bar"></div>
  </div>

  <div id="screen-ns1" class="interrupt-screen"><img src="data/nextstop_1.png" class="abs full-img" alt="" onerror="this.style.backgroundColor='#080302'"></div>
  <div id="screen-ns2" class="interrupt-screen"><img src="data/nextstop_2.png" class="abs full-img" alt="" onerror="this.style.backgroundColor='#111'"></div>
  <div id="screen-d1" class="interrupt-screen"><img src="data/depart_1.png" class="abs full-img" alt="" onerror="this.style.backgroundColor='#080302'"></div>
  <div id="screen-d2" class="interrupt-screen"><img src="data/depart_2.png" class="abs full-img" alt="" onerror="this.style.backgroundColor='#111'"></div>

  <div class="abs scroll-area">
    <div class="abs scroll-txt" id="scroll-txt">CSVファイルを選択してください</div>
  </div>
</div>

<div id="controller">
  <div class="panel-section">
    <h3>設定 & データ読み込み</h3>
    <div class="setting-group">
      <label>1. CSVファイルまたは変換済みフォルダを選択</label>
      <input type="file" id="csv-input" accept=".csv" multiple class="file-input">
      <label for="csv-folder-input" style="margin-top:8px;">または、変換済みCSVフォルダを選択</label>
      <input type="file" id="csv-folder-input" accept=".csv" multiple webkitdirectory class="file-input">
      <small>フォルダ内のCSVをまとめて読み込みます。iPhoneでは複数CSVの選択も使えます。</small>
    </div>
    <div class="setting-group">
      <label>2. 路線(ファイル)を選択</label>
      <select id="rosen-select" style="width: 100%; padding: 8px; font-size: 16px;">
        <option value="">ファイルを選択してください</option>
      </select>
    </div>
    <div class="setting-group">
      <label>サイズの変更 (画面幅)</label>
      <input type="range" id="size-slider" min="400" max="1200" value="800" style="width: 100%;">
    </div>
    <div class="setting-group">
      <label>位置情報による停留所自動進行 (操作端末で設定)</label>
      <div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">
        <button type="button" id="gps-start">GPS開始</button>
        <button type="button" id="gps-stop">GPS停止</button>
        <label style="display:inline-flex; align-items:center; gap:4px; font-weight:normal;">
          検知半径 <input type="number" id="gps-radius" value="45" min="10" max="300" style="width:70px; padding:6px;"> m
        </label>
        <label style="font-weight:normal;"><input type="checkbox" id="gps-auto" checked> 停留所で自動進行</label>
      </div>
      <small id="gps-status" role="status">GPS停止中。iPhoneでGPS開始を押すと位置情報の許可を求めます。</small>
    </div>
    <div style="display: flex; gap: 15px;">
      <div class="radio-group">
        <strong>押ボタン音源</strong>
        <label><input type="radio" name="push_sound" value="1" checked> 音源1</label>
        <label><input type="radio" name="push_sound" value="2"> 音源2</label>
        <label><input type="radio" name="push_sound" value="3"> 音源3</label>
        <label><input type="radio" name="push_sound" value="4"> なし</label>
      </div>
      <div class="radio-group">
        <strong>ドアブザー</strong>
        <label><input type="radio" name="door_buzzer" value="1" checked> ブザー1</label>
        <label><input type="radio" name="door_buzzer" value="2"> ブザー2</label>
        <label><input type="radio" name="door_buzzer" value="3"> ブザー3</label>
        <label><input type="radio" name="door_buzzer" value="4"> ブザー4</label>
      </div>
    </div>
  </div>

  <div class="panel-section">
    <h3>操作パネル (現在: <span id="mawashi-display">0</span>)</h3>
    <div class="stop-button" id="btn-stop">
      <div class="stop-button-text">とまります</div>
    </div>
    <div class="button-grid">
      <button class="btn-next" id="btn-next" disabled>次</button>
      <button class="btn-back" id="btn-back" disabled>戻</button>
      <button class="btn-door" id="btn-open">開</button>
      <button class="btn-door" id="btn-close" disabled>閉</button>
      <button class="btn-reset" id="btn-reset">ﾘｾｯﾄ</button>
    </div>
  </div>
</div>

<script src="route-csv.js?v=22"></script>
<script src="ipad-app.js?v=22"></script>
<script type="module" src="ipad-firebase.js?v=22"></script>
</body>
</html>
